<title>Lumen Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: left sidebar (views + conversations + connections) | assistant column | reader panel that slides in from the right.
   Graphite Sand, dark only. Source colors (mail / teams / calendar) are muted so they tag items without fighting the sand accent. */
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  color-scheme: dark;
  --bg: #0b0b0a; --panel: #111110; --raise: #191917; --line: #262521;
  --fg: #ecebe6; --muted: #8d8b82; --accent: #e9dcc0; --beam1: #b9a47c; --beam2: #f3eee2; --beam-o: .07;
  --mail: #8fb0d9; --teams: #a99fd8; --cal: #d2b98a; --ok: #9cc49a;
  --sans: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --t-fast: 180ms;
  --sbw: 264px; --pw: 0px;
}
html.panel-open { --pw: 460px; }
html.sb-off { --sbw: 0px; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid color-mix(in oklab, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; flex: none; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
p { margin: 0; }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--sbw) minmax(0, 1fr) var(--pw); transition: grid-template-columns .55s var(--ease-out); }

/* ---------- sidebar ---------- */
.sb { position: relative; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); z-index: 20; }
.sb::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 30%), color-mix(in oklab, var(--beam1) 8%, transparent), transparent 70%); }
.sb:hover::after { opacity: 1; }
.sb-inner { width: 264px; height: 100%; display: flex; flex-direction: column; padding: 14px 12px 12px; box-sizing: border-box; transition: opacity .35s var(--ease-out), transform .55s var(--ease-out); }
html.sb-off .sb-inner { opacity: 0; transform: translateX(-16px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; }
.mark { width: 22px; height: 22px; border-radius: 50%; position: relative; background: conic-gradient(from var(--a), var(--beam1), var(--beam2), var(--beam1)); animation: spin 8s linear infinite; }
.mark::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); }
.brand b { font-weight: 600; letter-spacing: -.01em; font-size: 15px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); transition: color var(--t-fast), background var(--t-fast); }
.icon-btn:hover { color: var(--fg); background: color-mix(in oklab, var(--fg) 6%, transparent); }
.brand .icon-btn { margin-left: auto; }
.new-chat { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--raise); font-weight: 500;
  transition: border-color var(--t-fast), box-shadow .3s, transform .2s var(--spring); }
.new-chat:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 7%, transparent); }
.new-chat:active { transform: scale(.98); }

.nav { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; margin: 8px -4px 0; padding: 0 4px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.indicator { position: absolute; left: 0; top: 0; height: 34px; width: 100px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); box-sizing: border-box; pointer-events: none;
  transition: transform .5s var(--spring), height .3s var(--ease-out), width .3s var(--ease-out), opacity .25s; }
.indicator::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.glabel { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 18px 10px 6px; opacity: .8; }
.item { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; box-sizing: border-box; border-radius: 10px; color: var(--muted); font-size: 13.5px; text-align: left; transition: color var(--t-fast); }
.item::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: color-mix(in oklab, var(--fg) 4%, transparent); opacity: 0; transition: opacity var(--t-fast); }
.item:hover { color: var(--fg); }
.item:hover::before { opacity: 1; }
.item.active { color: var(--fg); }
.item.active::before { opacity: 0; }
.item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ico { width: 15px; height: 15px; opacity: .85; }
.badge { font: 500 11px var(--mono); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; display: grid; place-items: center;
  background: color-mix(in oklab, var(--accent) 14%, transparent); color: var(--accent); }
.badge.plain { background: none; color: var(--muted); }
.row { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .4s var(--ease-out), opacity .3s; }
.row > div { min-height: 0; overflow: hidden; }
.row.entering { grid-template-rows: 0fr; opacity: 0; }

.conn { border-top: 1px solid var(--line); margin-top: 8px; padding: 10px 6px 4px; display: grid; gap: 6px; }
.conn-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 3px 4px; }
.conn-row .ico { width: 14px; height: 14px; }
.conn-row small { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); position: relative; flex: none; }
.live::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--ok); opacity: 0; animation: ping 2.4s var(--ease-out) infinite; }
.conn-row:nth-child(2) .live::after { animation-delay: 1.2s; }
.me { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; }
.me div { flex: 1; min-width: 0; line-height: 1.25; }
.me small { color: var(--muted); font-size: 12px; }

/* avatars */
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 600; color: #141412;
  background: hsl(var(--h, 40) 22% 70%); }
.av.me-av { background: linear-gradient(135deg, var(--beam2), var(--beam1)); width: 30px; height: 30px; font-size: 12px; }

/* ---------- main ---------- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; isolation: isolate; }
.bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg .glow { position: absolute; left: 50%; top: -40%; width: 120%; height: 80%; transform: translateX(-50%);
  background: radial-gradient(closest-side, color-mix(in oklab, var(--beam1) 16%, transparent), transparent); animation: breathe 9s ease-in-out infinite alternate; }
.beam { position: absolute; top: -35%; height: 170%; width: 140px; filter: blur(38px); opacity: var(--beam-o); mix-blend-mode: screen;
  background: linear-gradient(180deg, transparent 5%, var(--c, var(--beam1)) 45%, transparent 85%); transform: rotate(22deg); animation: drift var(--d, 20s) ease-in-out infinite alternate; }
.beam:nth-child(2) { left: 14%; --d: 23s; }
.beam:nth-child(3) { left: 44%; --c: var(--beam2); width: 70px; --d: 17s; animation-delay: -6s; }
.beam:nth-child(4) { left: 76%; --d: 26s; width: 180px; animation-delay: -11s; }
.grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.top { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; flex: none; }
.title-wrap { position: relative; flex: 1; min-width: 0; height: 22px; overflow: hidden; }
.title { position: absolute; inset: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .45s var(--ease-out), opacity .3s, filter .3s; }
.title.out { transform: translateY(-14px); opacity: 0; filter: blur(4px); }
.title.in { transform: translateY(14px); opacity: 0; filter: blur(4px); }
.today { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.thread { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.col { max-width: 780px; margin: 0 auto; padding: 20px 24px 230px; box-sizing: border-box; transition: opacity .2s, filter .2s, transform .2s; }
.col.leaving { opacity: 0; filter: blur(6px); transform: translateY(6px); }

.msg { display: flex; gap: 14px; margin-bottom: 30px; }
.msg.enter { animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 78%; padding: 10px 15px; border-radius: 18px 18px 6px 18px; background: var(--raise); border: 1px solid var(--line); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user.fresh .bubble { animation: pop .55s var(--spring) both; transform-origin: bottom right; }
.orb { width: 26px; height: 26px; border-radius: 50%; flex: none; margin-top: 2px; position: relative; background: conic-gradient(from var(--a), var(--beam1), var(--beam2), var(--beam1)); animation: spin 7s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in oklab, var(--fg) 30%, var(--bg)), var(--bg) 70%); }
.msg.thinking .orb { animation-duration: 1.4s; box-shadow: 0 0 22px color-mix(in oklab, var(--beam1) 60%, transparent); }
.body { flex: 1; min-width: 0; line-height: 1.72; font-size: 15px; }
.body > p { margin: 0 0 12px; }
.body ul { margin: 0 0 12px; padding-left: 20px; }
.body li { margin-bottom: 6px; }
.body li::marker { color: var(--accent); }
.body strong { font-weight: 600; }
.tok { display: inline-block; animation: tokin .55s var(--ease-out) both; white-space: pre; }
.think { display: inline-block; font-size: 13px; color: transparent; background: linear-gradient(90deg, var(--muted) 20%, var(--fg) 50%, var(--muted) 80%) 0 0 / 200% 100%;
  -webkit-background-clip: text; background-clip: text; animation: shimmer 1.5s linear infinite; }

/* tool steps */
.steps { border: 1px solid var(--line); border-radius: 12px; background: color-mix(in oklab, var(--panel) 70%, transparent); margin: 0 0 16px; overflow: hidden; }
.steps-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; font-size: 13px; color: var(--muted); text-align: left; transition: color var(--t-fast); }
button.steps-head:hover { color: var(--fg); }
.steps-head .ico { width: 14px; height: 14px; color: var(--accent); }
.steps-head small { margin-left: auto; font-size: 12px; opacity: .8; }
.steps-head .chev { color: var(--muted); transition: transform .4s var(--spring); }
.steps.collapsed .steps-head .chev { transform: rotate(-90deg); }
.steps-list { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .5s var(--ease-out); }
.steps.collapsed .steps-list { grid-template-rows: 0fr; }
.steps-list > div { min-height: 0; overflow: hidden; }
.steps-list > div > :first-child { border-top: 1px solid var(--line); }
.step { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); animation: rise .45s var(--ease-out) both; }
.step b { color: var(--fg); font-weight: 500; }
.step small { font-size: 12px; }
.st { position: relative; width: 16px; height: 16px; flex: none; }
.st .spin { position: absolute; inset: 1px; border-radius: 50%; border: 1.5px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; transition: opacity .2s; }
.st svg { position: absolute; inset: 0; width: 16px; height: 16px; stroke: var(--ok); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .45s var(--ease-out) .1s; }
.step.ok .spin { opacity: 0; }
.step.ok .st svg { stroke-dashoffset: 0; }
.s-ico { color: var(--muted); }
.s-ico .ico { width: 14px; height: 14px; }
.faces { display: flex; margin-left: auto; padding-left: 8px; }
.faces .av { width: 22px; height: 22px; font-size: 9px; margin-left: -6px; box-shadow: 0 0 0 2px var(--panel); animation: popin .5s var(--spring) both; }
.faces .av:nth-child(2) { animation-delay: .15s; } .faces .av:nth-child(3) { animation-delay: .3s; } .faces .av:nth-child(4) { animation-delay: .45s; }

/* item cards */
.stack { display: grid; gap: 10px; margin: 4px 0 8px; }
.xcard { position: relative; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in oklab, var(--panel) 88%, transparent); padding: 12px 14px 8px; font-size: 14px;
  animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 80ms);
  transition: border-color .3s, transform .35s var(--spring), box-shadow .4s, opacity .3s; }
.xcard::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), color-mix(in oklab, var(--beam1) 10%, transparent), transparent 70%); }
.xcard:hover { border-color: color-mix(in oklab, var(--accent) 22%, var(--line)); }
.xcard:hover::before { opacity: 1; }
.xcard.peeking { border-color: color-mix(in oklab, var(--accent) 30%, var(--line)); box-shadow: 0 18px 50px -24px #000; }
.xcard.is-open { border-color: color-mix(in oklab, var(--accent) 55%, var(--line)); }
.xcard.is-open::after { content: "Open in panel"; position: absolute; top: -9px; right: 14px; font-size: 10.5px; letter-spacing: .04em; padding: 1px 8px; border-radius: 999px;
  background: var(--accent); color: var(--bg); font-weight: 600; animation: popin .4s var(--spring) both; }
.xcard.launched { transform: scale(.985); opacity: .6; }
.c-head { display: flex; align-items: center; gap: 10px; }
.c-meta { min-width: 0; line-height: 1.25; }
.c-meta b { font-weight: 500; }
.c-meta small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; flex: none; }
.src .ico { width: 13px; height: 13px; }
.src.mail .ico { color: var(--mail); } .src.teams .ico { color: var(--teams); } .src.cal .ico { color: var(--cal); }
.c-subj { font-weight: 500; margin-top: 9px; letter-spacing: -.005em; }
.c-snip { color: var(--muted); font-size: 13.5px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag .ico { width: 12px; height: 12px; }
.tag.hot { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
.mention { color: var(--accent); font-weight: 500; }
.c-actions { display: flex; align-items: center; gap: 2px; margin: 8px 0 0 -8px; }
.mini { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap;
  transition: background var(--t-fast), color var(--t-fast), transform .25s var(--spring); }
.mini:hover { background: color-mix(in oklab, var(--fg) 7%, transparent); color: var(--fg); }
.mini:active { transform: scale(.95); }
.mini .ico { width: 14px; height: 14px; }
.mini.pri { color: var(--fg); background: color-mix(in oklab, var(--fg) 6%, transparent); }
.mini.solid { background: var(--fg); color: var(--bg); }
.mini.solid:hover { background: var(--accent); color: var(--bg); }
.mini .ico.flip { transition: transform .4s var(--spring); }
.peeking [data-preview] .ico.flip { transform: rotate(180deg); }
.push { margin-left: auto; }

/* inline preview */
.peek { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease-out); }
.xcard.peeking .peek { grid-template-rows: 1fr; }
.peek > div { min-height: 0; overflow: hidden; }
.peek-in { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 10px; font-size: 13.5px; line-height: 1.65; color: color-mix(in oklab, var(--fg) 82%, var(--muted));
  opacity: 0; transform: translateY(-6px); filter: blur(3px); transition: opacity .3s, transform .45s var(--ease-out), filter .3s; }
.xcard.peeking .peek-in { opacity: 1; transform: none; filter: none; transition-delay: .08s; }
.peek-in p { white-space: pre-line; }
.ai-sum { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; background: color-mix(in oklab, var(--accent) 7%, transparent); color: var(--fg); font-size: 13px; }
.ai-sum .ico { color: var(--accent); width: 14px; height: 14px; margin-top: 3px; }
.file { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); font-size: 12.5px; width: fit-content; max-width: 100%; box-sizing: border-box; }
.file .ico { color: var(--muted); }
.file small { color: var(--muted); }
.reply-line { display: flex; gap: 9px; align-items: flex-start; }
.reply-line .av { width: 22px; height: 22px; font-size: 9px; margin-top: 2px; }
.reply-line b { font-weight: 500; color: var(--fg); margin-right: 6px; }
.reply-line small { color: var(--muted); }
.agenda { margin: 0; padding-left: 18px; }
.agenda li::marker { color: var(--cal); }

/* meeting + draft variants */
.m-row { display: flex; gap: 14px; align-items: flex-start; }
.when { flex: none; width: 58px; padding-right: 12px; border-right: 1px solid var(--line); line-height: 1.2; }
.when b { display: block; font-size: 19px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.when small { color: var(--muted); font-size: 11.5px; }
.m-main { flex: 1; min-width: 0; }
.m-main .c-subj { margin-top: 0; }
.m-main .faces { margin: 8px 0 0 6px; padding: 0; }
.m-main .faces .av { animation: none; }
.soon { font-size: 11.5px; color: var(--cal); }
.d-body { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: color-mix(in oklab, var(--bg) 60%, transparent); border: 1px solid var(--line); display: grid; gap: 8px; font-size: 13.5px; line-height: 1.65; white-space: pre-line; }
.d-to { color: var(--muted); font-size: 12.5px; }

/* home */
.hero { padding-top: 11vh; }
.hero h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); font-weight: 400; letter-spacing: -.035em; line-height: 1.1; text-wrap: balance; text-align: center; }
.hero h1 .w { display: inline-block; animation: tokin .9s var(--ease-out) both; animation-delay: calc(var(--i) * 90ms); }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero > p { color: var(--muted); margin: 12px 0 34px; font-size: 15px; text-align: center; animation: rise .8s var(--ease-out) .35s both; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; text-align: left; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 80%, transparent); overflow: hidden;
  animation: rise .7s var(--ease-out) both; animation-delay: calc(.45s + var(--i) * 80ms); transition: border-color .3s, transform .35s var(--spring); }
.tile:hover { border-color: color-mix(in oklab, var(--accent) 30%, var(--line)); transform: translateY(-2px); }
.tile .src { margin: 0 0 14px; }
.tile b { display: block; font-size: 30px; font-weight: 400; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span.l { display: block; margin-top: 6px; font-weight: 500; }
.tile small { color: var(--muted); font-size: 12.5px; }

.feed-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 10px 0 16px; animation: rise .5s var(--ease-out) both; }
.feed-head h2 { margin: 0; font-size: 26px; font-weight: 400; letter-spacing: -.03em; }
.feed-head small { color: var(--muted); font-size: 12.5px; }

/* ---------- composer ---------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 24px 16px; background: linear-gradient(transparent, var(--bg) 40%); pointer-events: none; }
.suggest { pointer-events: auto; max-width: 780px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; transition: opacity .3s, transform .4s var(--ease-out); }
.busy-on .suggest { opacity: 0; transform: translateY(6px); pointer-events: none; }

/* ---------- streaming turn ---------- */
let busy = false, stop = false;
const nearBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 160;
const follow = () => { thread.scrollTop = thread.scrollHeight; };
async function streamWords(parent, text) {
  for (const g of segs(text)) {
    const host = g.tag ? parent.appendChild(document.createElement(g.tag)) : parent;
    for (const w of g.s.split(/(\s+)/)) {
      if (stop) return; if (!w) continue;
      if (/^\s+$/.test(w)) { host.append(w); continue; }
      const s = document.createElement('span'); s.className = 'tok'; s.textContent = w; host.append(s);
      if (nearBottom()) follow();
      await sleep(20 + Math.random() * 34);
    }
  }
}

async function run(fk, typed) {
  if (busy) return;
  if (!convos[view]) { await show('today'); }
  const c = convos[view], f = F[fk], q = typed || f.q;
  if (c.fresh) {
    c.fresh = false; c.title = q.length > 34 ? q.slice(0, 32).trim() + '...' : q;
    $('.hero', col)?.animate([{ opacity: 1 }, { opacity: 0, filter: 'blur(6px)', transform: 'translateY(-8px)' }], { duration: 220, fill: 'forwards' });
    await sleep(200); col.innerHTML = ''; addConvo(view); setTitle(c.title);
  }
  c.items.push({ u: q }); col.append(userEl(q, true)); ta.value = ''; fit(); follow();
  busy = true; stop = false; html.classList.add('busy-on'); sendBtn.disabled = false; sendBtn.setAttribute('aria-label', 'Stop');
  const m = aiEl(); m.classList.add('thinking', 'enter'); col.append(m);
  const body = m.querySelector('.body');
  body.innerHTML = '<div class="steps"><div class="steps-head"><span class="think">Working on it</span></div><div class="steps-list"><div></div></div></div>';
  const steps = body.firstElementChild, list = steps.querySelector('.steps-list > div');
  follow(); await sleep(500);
  for (const s of f.steps) {
    if (stop) break;
    list.insertAdjacentHTML('beforeend', stepRow(s, false)); const row = list.lastElementChild; follow();
    await sleep(800 + Math.random() * 500 + (s.faces ? s.faces.length * 150 : 0));
    row.classList.add('ok'); row.querySelector('b').textContent = s.done;
    await sleep(160);
  }
  steps.firstElementChild.outerHTML = stepsHead(f);
  m.classList.remove('thinking');
  if (!stop) { await sleep(350); steps.classList.add('collapsed'); await sleep(250); }
  for (const b of f.text) {
    if (stop) break;
    if (b.t === 'p') await streamWords(body.appendChild(document.createElement('p')), b.x);
    else { const ul = body.appendChild(document.createElement('ul')); for (const i of b.x) { if (stop) break; await streamWords(ul.appendChild(document.createElement('li')), i); } }
    await sleep(80);
  }
  if (!stop) {
    const stack = body.appendChild(document.createElement('div')); stack.className = 'stack';
    for (let i = 0; i < f.cards.length; i++) { stack.insertAdjacentHTML('beforeend', cardHTML(f.cards[i], 0)); if (nearBottom()) follow(); await sleep(140); }
    c.items.push({ f: fk });
  } else body.insertAdjacentHTML('beforeend', '<p style="color:var(--muted);font-size:13px">Stopped.</p>');
  busy = false; stop = false; html.classList.remove('busy-on'); sendBtn.setAttribute('aria-label', 'Send'); fit();
}
async function addConvo(id) {
  const host = $('#convList'); host.insertAdjacentHTML('afterbegin', navItem(id, 'chat', ''));
  const row = host.firstElementChild, it = row.querySelector('.item'), lbl = it.querySelector('.lbl'), full = convos[id].title;
  row.classList.add('entering'); $$('.item.active', nav).forEach(x => x.classList.remove('active')); it.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { row.classList.remove('entering'); trackIndicator(); }));
  await sleep(200); for (let i = 1; i <= full.length; i++) { lbl.textContent = full.slice(0, i); await sleep(16); }
}

  ta.style.transition = ''; ta.style.height = next + 'px'; ta.style.overflowY = ta.scrollHeight > 200 ? 'auto' : 'hidden';
  if (!busy) sendBtn.disabled = !ta.value.trim();
}

function targetRect() {
  if (phone()) return { left: 0, top: innerHeight * .08, width: innerWidth, height: innerHeight * .92, radius: '20px 20px 0 0' };
  const w = Math.min(460, innerWidth); return { left: innerWidth - w, top: 0, width: w, height: innerHeight, radius: '0px' };
}
function markOpenCard() { $$('.xcard.is-open', col).forEach(c => c.classList.remove('is-open')); if (openKey) $$(`.xcard[data-kind="${openKey[0]}"][data-id="${openKey[1]}"]`, col).forEach(c => c.classList.add('is-open')); }
async function openPanel(k, id, card) {
  const wasOpen = html.classList.contains('panel-open');
  if (wasOpen && openKey && openKey[0] === k && openKey[1] === id) return;
  openKey = [k, id];
  if (wasOpen) {
    pBody.animate([{ opacity: 1 }, { opacity: 0, filter: 'blur(4px)' }], { duration: 160, fill: 'forwards' });
    await sleep(160); pBody.getAnimations().forEach(a => a.cancel());
    pBody.classList.remove('reveal'); fillPanel(k, id); void pBody.offsetWidth; pBody.classList.add('reveal'); markOpenCard(); return;
  }
  fillPanel(k, id); pBody.classList.remove('reveal');
  const r = card.getBoundingClientRect(), t = targetRect();
  const g = document.createElement('div'); g.className = 'ghost';
  const inner = document.createElement('div'); inner.innerHTML = card.innerHTML; inner.style.width = r.width + 'px'; inner.style.boxSizing = 'border-box'; g.append(inner);
  Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  document.body.append(g);
  card.classList.add('launched');
  html.classList.add('panel-open');
  const from = { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '14px', opacity: 1 };
  const to = { left: t.left + 'px', top: t.top + 'px', width: t.width + 'px', height: t.height + 'px', borderRadius: t.radius };
  inner.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(6px)' }], { duration: 220, fill: 'forwards' });
  g.animate([from, { ...to, opacity: 1, offset: .82 }, { ...to, opacity: 0 }], { duration: 620, easing: 'cubic-bezier(.22, 1, .36, 1)', fill: 'forwards' }).onfinish = () => g.remove();
  setTimeout(() => { pBody.classList.add('reveal'); card.classList.remove('launched'); markOpenCard(); }, 340);
}
function closePanel() { if (!html.classList.contains('panel-open')) return; html.classList.remove('panel-open'); openKey = null; markOpenCard(); }
$('#pClose').onclick = closePanel;
pExt.onclick = () => toast(pExt.dataset.t);
panel.addEventListener('click', e => {
  const t = e.target.closest('[data-ptoast]'); if (t) return toast(t.dataset.ptoast);

});

let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1900); }

document.addEventListener('keydown', e => {
