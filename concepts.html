<title>Lumen Chat Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left sidebar (tree of chats) + one centered conversation column with a floating composer.
   Dark-only by design. Three "looks" swap the tokens below and cross-fade through @property. */
@property --bg     { syntax: '<color>'; inherits: true; initial-value: #050608; }
@property --panel  { syntax: '<color>'; inherits: true; initial-value: #0a0c10; }
@property --raise  { syntax: '<color>'; inherits: true; initial-value: #11141a; }
@property --line   { syntax: '<color>'; inherits: true; initial-value: #1a1f29; }
@property --fg     { syntax: '<color>'; inherits: true; initial-value: #e8ecf3; }
@property --muted  { syntax: '<color>'; inherits: true; initial-value: #7d8697; }
@property --accent { syntax: '<color>'; inherits: true; initial-value: #8ab4ff; }
@property --beam1  { syntax: '<color>'; inherits: true; initial-value: #5b8cff; }
@property --beam2  { syntax: '<color>'; inherits: true; initial-value: #5fe3ff; }
@property --a      { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  color-scheme: dark;
  --bg: #0b0b0a; --panel: #111110; --raise: #191917; --line: #262521;
  --fg: #ecebe6; --muted: #8d8b82; --accent: #e9dcc0; --beam1: #b9a47c; --beam2: #f3eee2;
  --beam-o: .07;
  --sans: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --t-fast: 180ms; --t-base: 450ms; --t-slow: 700ms;
  --sbw: 272px;
  transition: --bg var(--t-slow), --panel var(--t-slow), --raise var(--t-slow), --line var(--t-slow),
              --fg var(--t-slow), --muted var(--t-slow), --accent var(--t-slow), --beam1 var(--t-slow), --beam2 var(--t-slow);
}

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid color-mix(in oklab, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; flex: none; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--sbw) minmax(0, 1fr); transition: grid-template-columns .55s var(--ease-out); }
html.sb-off { --sbw: 0px; }

/* ---------- sidebar ---------- */
.sb { position: relative; overflow: hidden; background: color-mix(in oklab, var(--panel) 88%, transparent); border-right: 1px solid var(--line); z-index: 20; }
.sb::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 30%), color-mix(in oklab, var(--beam1) 9%, transparent), transparent 70%); }
.sb:hover::after { opacity: 1; }
.sb-inner { width: 272px; height: 100%; display: flex; flex-direction: column; padding: 14px 12px 12px; box-sizing: border-box; transition: opacity .35s var(--ease-out), transform .55s var(--ease-out); }
html.sb-off .sb-inner { opacity: 0; transform: translateX(-16px); }

.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; }
.mark { width: 22px; height: 22px; border-radius: 50%; position: relative;
  background: conic-gradient(from var(--a), var(--beam1), var(--beam2), var(--beam1)); animation: spin 8s linear infinite; }
.mark::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); }
.brand b { font-weight: 600; letter-spacing: -.01em; font-size: 15px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); transition: color var(--t-fast), background var(--t-fast); }
.icon-btn:hover { color: var(--fg); background: color-mix(in oklab, var(--fg) 6%, transparent); }
.brand .icon-btn { margin-left: auto; }

.new-chat { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--raise); font-weight: 500; transition: border-color var(--t-fast), box-shadow .3s, transform .2s var(--spring); }
.new-chat:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 7%, transparent); }
.new-chat:active { transform: scale(.98); }
kbd { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

.search { margin-top: 10px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--muted);
  border: 1px solid transparent; transition: border-color var(--t-fast), background var(--t-fast); }
.search:focus-within { border-color: var(--line); background: color-mix(in oklab, var(--fg) 3%, transparent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 13.5px; color: var(--fg); }
.search input::placeholder { color: var(--muted); }

.nav { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; margin: 6px -4px 0; padding: 0 4px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.indicator { position: absolute; left: 0; top: 0; height: 34px; width: 100px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line);
  box-sizing: border-box; pointer-events: none; z-index: 0;
  transition: transform .5s var(--spring), height .3s var(--ease-out), width .3s var(--ease-out), opacity .25s; }
.indicator::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--accent);
  box-shadow: 0 0 10px var(--accent); }
.glabel { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 18px 10px 6px; opacity: .8; }

.row { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .4s var(--ease-out), opacity .3s; }
.row > div { min-height: 0; overflow: hidden; }
.row.hide, .row.entering { grid-template-rows: 0fr; opacity: 0; }
.item { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; box-sizing: border-box;
  border-radius: 10px; color: var(--muted); font-size: 13.5px; text-align: left; transition: color var(--t-fast); }
.item::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: color-mix(in oklab, var(--fg) 4%, transparent); opacity: 0; transition: opacity var(--t-fast); }
.item:hover { color: var(--fg); }
.item:hover::before { opacity: 1; }
.item.active { color: var(--fg); }
.item.active::before { opacity: 0; }
.item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ico { width: 15px; height: 15px; opacity: .8; }
.item .chev { transition: transform .4s var(--spring); }
.folder.closed .chev { transform: rotate(-90deg); }
.folder-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--ease-out); }
.folder.closed .folder-body { grid-template-rows: 0fr; }
.folder-body > div { min-height: 0; overflow: hidden; position: relative; padding-left: 16px; }
.folder-body > div::before { content: ""; position: absolute; left: 17px; top: 2px; bottom: 8px; width: 1px; background: var(--line); }
.folder-body .item { padding-left: 14px; }
.folder .count { font: 500 11px var(--mono); color: var(--muted); opacity: .7; }

.me { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--line); margin-top: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--bg);
  background: linear-gradient(135deg, var(--beam2), var(--beam1)); }
.me div { flex: 1; min-width: 0; line-height: 1.25; }
.me small { color: var(--muted); font-size: 12px; }

/* ---------- main ---------- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; isolation: isolate; }
.bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bg .glow { position: absolute; left: 50%; top: -38%; width: 120%; height: 80%; transform: translateX(-50%);
  background: radial-gradient(closest-side, color-mix(in oklab, var(--beam1) 22%, transparent), transparent); opacity: .7; animation: breathe 9s ease-in-out infinite alternate; }
.beam { position: absolute; top: -35%; height: 170%; width: 140px; filter: blur(38px); opacity: var(--beam-o); mix-blend-mode: screen;
  background: linear-gradient(180deg, transparent 5%, var(--c, var(--beam1)) 45%, transparent 85%);
  transform: rotate(22deg); animation: drift var(--d, 20s) ease-in-out infinite alternate; }
.beam:nth-child(2) { left: 12%; --d: 23s; }
.beam:nth-child(3) { left: 38%; --c: var(--beam2); width: 70px; --d: 17s; animation-delay: -6s; }
.beam:nth-child(4) { left: 61%; --d: 26s; width: 180px; animation-delay: -11s; }
.beam:nth-child(5) { left: 84%; --c: var(--beam2); width: 90px; --d: 19s; animation-delay: -3s; }
.grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.top { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; flex: none; }
.title-wrap { position: relative; flex: 1; min-width: 0; height: 22px; overflow: hidden; }
.title { position: absolute; inset: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .45s var(--ease-out), opacity .3s, filter .3s; }
.title.out { transform: translateY(-14px); opacity: 0; filter: blur(4px); }
.title.in { transform: translateY(14px); opacity: 0; filter: blur(4px); }

.model { position: relative; }
.model-btn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 9px; color: var(--muted); font-size: 13px; transition: background var(--t-fast), color var(--t-fast); }
.model-btn:hover, .model.open .model-btn { background: color-mix(in oklab, var(--fg) 6%, transparent); color: var(--fg); }
.model-btn .chev { transition: transform .35s var(--spring); }
.model.open .model-btn .chev { transform: rotate(180deg); }
.pop { position: absolute; right: 0; top: 40px; width: 260px; padding: 6px; border-radius: 14px; background: color-mix(in oklab, var(--raise) 92%, transparent);
  border: 1px solid var(--line); backdrop-filter: blur(16px); box-shadow: 0 24px 60px -12px #000c; z-index: 40;
  opacity: 0; transform: translateY(-6px) scale(.96); transform-origin: top right; pointer-events: none; transition: opacity .2s, transform .35s var(--spring); }
.model.open .pop { opacity: 1; transform: none; pointer-events: auto; }
.opt { display: flex; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 9px; text-align: left; transition: background var(--t-fast); }
.opt:hover { background: color-mix(in oklab, var(--fg) 6%, transparent); }
.opt div { flex: 1; }
.opt b { display: block; font-weight: 500; font-size: 13.5px; }
.opt small { color: var(--muted); font-size: 12px; }
.opt .ico { opacity: 0; transform: scale(.5); transition: opacity .2s, transform .35s var(--spring); color: var(--accent); margin-top: 2px; }
.opt.sel .ico { opacity: 1; transform: none; }

.seg { position: relative; display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in oklab, var(--panel) 80%, transparent); }
.seg button { position: relative; z-index: 1; padding: 4px 12px; font-size: 12.5px; color: var(--muted); border-radius: 999px; transition: color .3s; }
.seg button[aria-pressed="true"] { color: var(--fg); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); box-sizing: border-box;
  transition: transform .5s var(--spring), width .35s var(--ease-out); }

/* ---------- thread ---------- */
.thread { flex: 1; overflow-y: auto; scroll-behavior: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.col { max-width: 760px; margin: 0 auto; padding: 24px 24px 200px; box-sizing: border-box; transition: opacity .2s, filter .2s, transform .2s; }
.col.leaving { opacity: 0; filter: blur(6px); transform: translateY(6px); }

.msg { display: flex; gap: 14px; margin-bottom: 30px; }
.msg.enter { animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 78%; padding: 10px 15px; border-radius: 18px 18px 6px 18px; background: var(--raise); border: 1px solid var(--line); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user.fresh .bubble { animation: pop .55s var(--spring) both; transform-origin: bottom right; }
.orb { width: 26px; height: 26px; border-radius: 50%; flex: none; margin-top: 2px; position: relative;
  background: conic-gradient(from var(--a), var(--beam1), var(--beam2), var(--beam1)); animation: spin 7s linear infinite; }
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in oklab, var(--fg) 30%, var(--bg)), var(--bg) 70%); }
.msg.thinking .orb { animation-duration: 1.4s; box-shadow: 0 0 22px color-mix(in oklab, var(--beam1) 60%, transparent); }
.body { flex: 1; min-width: 0; line-height: 1.72; font-size: 15px; }
.body p { margin: 0 0 12px; }
.body ul { margin: 0 0 12px; padding-left: 20px; }
.body li { margin-bottom: 6px; }
.body li::marker { color: var(--accent); }
.body strong { font-weight: 600; }
.body code { font: 13px var(--mono); padding: 1px 5px; border-radius: 5px; background: color-mix(in oklab, var(--fg) 7%, transparent); }
.tok { display: inline-block; animation: tokin .55s var(--ease-out) both; white-space: pre; }
.think { display: inline-block; font-size: 14px; color: transparent; padding-top: 3px;
  background: linear-gradient(90deg, var(--muted) 20%, var(--fg) 50%, var(--muted) 80%) 0 0 / 200% 100%; -webkit-background-clip: text; background-clip: text;
  animation: shimmer 1.5s linear infinite; }
.code { margin: 14px 0 16px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: color-mix(in oklab, var(--bg) 55%, #000); }
.code header { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); font: 12px var(--mono); color: var(--muted); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 12.8px/1.65 var(--mono); }
.code .ln { display: block; min-height: 1.65em; animation: linein .45s var(--ease-out) both; white-space: pre; }
.k { color: var(--accent); } .c { color: var(--muted); font-style: italic; } .n { color: var(--beam2); }
.mini { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; font-size: 12px; color: var(--muted); transition: background var(--t-fast), color var(--t-fast); }
.mini:hover { background: color-mix(in oklab, var(--fg) 7%, transparent); color: var(--fg); }
.mini .ico { width: 14px; height: 14px; }
.actions { display: flex; gap: 2px; margin-left: -8px; opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .4s var(--ease-out); }
.msg.done .actions { opacity: .55; transform: none; }
.msg.done:hover .actions { opacity: 1; }

/* empty state */
.hero { padding-top: 13vh; text-align: center; }
.hero h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); font-weight: 400; letter-spacing: -.035em; line-height: 1.1; text-wrap: balance; }
.hero h1 .w { display: inline-block; animation: tokin .9s var(--ease-out) both; animation-delay: calc(var(--i) * 90ms); }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--beam2), var(--beam1), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); margin: 12px 0 34px; font-size: 15px; animation: rise .8s var(--ease-out) .35s both; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
.card { position: relative; display: flex; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 75%, transparent);
  overflow: hidden; animation: rise .7s var(--ease-out) both; animation-delay: calc(.45s + var(--i) * 70ms); transition: border-color .3s, transform .35s var(--spring); }
.card::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .3s;
  background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), color-mix(in oklab, var(--beam1) 14%, transparent), transparent 70%); }
.card:hover { border-color: color-mix(in oklab, var(--accent) 30%, var(--line)); transform: translateY(-2px); }
.card:hover::before { opacity: 1; }
.card .ico { color: var(--accent); margin-top: 2px; }
.card b { display: block; font-weight: 500; }
.card small { color: var(--muted); font-size: 12.5px; }

/* ---------- composer ---------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 24px 18px; background: linear-gradient(transparent, var(--bg) 45%); pointer-events: none; }
.composer { pointer-events: auto; position: relative; max-width: 760px; margin: 0 auto; border-radius: 20px; border: 1px solid var(--line);
  background: color-mix(in oklab, var(--panel) 92%, transparent); backdrop-filter: blur(14px); box-sizing: border-box;
  transition: border-color .4s, box-shadow .5s var(--ease-out); }
.composer::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: conic-gradient(from var(--a), transparent 0deg 250deg, var(--beam2) 300deg, var(--beam1) 335deg, transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity .5s; animation: spin 4.5s linear infinite; }
.composer:focus-within::before, .composer.busy::before { opacity: 1; }
.composer.busy::before { animation-duration: 1.6s; }
.composer:focus-within { border-color: color-mix(in oklab, var(--line) 50%, transparent); box-shadow: 0 24px 70px -24px color-mix(in oklab, var(--beam1) 45%, transparent); }
.composer textarea { display: block; width: 100%; box-sizing: border-box; resize: none; border: 0; outline: none; background: none;
  padding: 15px 18px 4px; font-size: 15px; line-height: 1.55; height: 39px; max-height: 220px; overflow: hidden; transition: height .22s var(--ease-out); }
.composer textarea::placeholder { color: var(--muted); }
.tools { display: flex; align-items: center; gap: 4px; padding: 6px 8px 8px 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted);
  border: 1px solid transparent; transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast); }
.chip:hover { color: var(--fg); background: color-mix(in oklab, var(--fg) 5%, transparent); }
.chip[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent); background: color-mix(in oklab, var(--accent) 9%, transparent); }
.chip.round { width: 30px; padding: 0; justify-content: center; }
.send { margin-left: auto; position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center;
  transition: opacity .25s, transform .3s var(--spring), background .3s; }
.send:disabled { opacity: .28; cursor: default; }
.send:not(:disabled):hover { transform: scale(1.07); }
.send:not(:disabled):active { transform: scale(.94); }
.send svg { position: absolute; transition: transform .4s var(--spring), opacity .2s; }
.send .i-stop { opacity: 0; transform: scale(.3) rotate(-90deg); }
.composer.busy .send .i-send { opacity: 0; transform: scale(.3) translateY(-6px); }
.composer.busy .send .i-stop { opacity: 1; transform: none; }
.hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; opacity: .7; pointer-events: auto; }

.scrim { display: none; }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 10px); padding: 7px 14px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line);
  font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .4s var(--spring); z-index: 60; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- keyframes ---------- */
@keyframes spin { to { --a: 360deg; } }
@keyframes tokin { from { opacity: 0; filter: blur(7px); transform: translateY(3px); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.94); filter: blur(4px); } }
@keyframes linein { from { opacity: 0; transform: translateX(-6px); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes drift { from { transform: rotate(22deg) translateX(-60px); } to { transform: rotate(16deg) translateX(80px); } }
@keyframes breathe { from { opacity: .45; } to { opacity: .85; } }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sb { position: fixed; inset: 0 auto 0 0; width: 284px; transform: translateX(-102%); transition: transform .5s var(--ease-out); box-shadow: 30px 0 80px #000a; }
  html.sb-open .sb { transform: none; }
  html.sb-off .sb-inner { opacity: 1; transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: #0008; opacity: 0; pointer-events: none; transition: opacity .4s; }
  html.sb-open .scrim { opacity: 1; pointer-events: auto; }
  .top { padding: 0 10px; }
  .model-btn span { display: none; }

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const html = document.documentElement;
const phone = () => matchMedia('(max-width: 760px)').matches;

/* icons */
const P = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>',
  panel: '<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  chat: '<path d="M5 18.5V7a2.5 2.5 0 0 1 2.5-2.5h9A2.5 2.5 0 0 1 19 7v6.5a2.5 2.5 0 0 1-2.5 2.5H8.5Z"/>',
  folder: '<path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/>',
  pin: '<path d="M14.5 4.5 19.5 9.5l-3 1.5-3.5 3.5.5 4-2 1-3.5-3.5L4 19.5M8 12.5l3.5 3.5"/><path d="m13 4 7 7"/>',
  copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  redo: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/>',
  up: '<path d="M7.5 10.5v9h-3v-9ZM7.5 10.5l4-6.5a2 2 0 0 1 3.5 1.8L14 9.5h4.6a2 2 0 0 1 2 2.4l-1.3 6a2 2 0 0 1-2 1.6H7.5"/>',
  clip: '<path d="m20 11.5-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5Z"/>',
  spark: '<path d="M12 3.5 13.8 10l6.7 2-6.7 2L12 20.5 10.2 14 3.5 12l6.7-2Z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.1-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2Z"/>',
  bolt: '<path d="M13 3.5 5.5 13.5h6l-1 7 7.5-10h-6Z"/>',
  layers: '<path d="m12 4 8.5 4.5L12 13 3.5 8.5Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/>',
  wand: '<path d="m4 20 11-11M14 4.5v3M12.5 6h3M19 9.5v3M17.5 11h3"/>',
  type: '<path d="M5 6.5V5h14v1.5M12 5v14M9.5 19h5"/>',
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24">${P[n]}</svg>`;
const hydrateIcons = (root = document) => $$('[data-i]', root).forEach(el => { el.insertAdjacentHTML('afterbegin', ico(el.dataset.i)); el.removeAttribute('data-i'); });
$('#sbClose').dataset.i = 'panel';

/* scripted replies */
const R = {
  motion: [
    { t: 'p', x: 'Keep one motion language across the app, so every movement feels like it belongs to the same system. Three rules carry most of the weight:' },
    { t: 'ul', x: [
      '**Enter with blur, leave fast.** New content fades in from a soft blur over 400 to 500ms. Anything leaving takes 150 to 200ms.',
      '**Springs for objects, eases for text.** Bubbles, popovers and the active pill use a light spring. Streaming text uses a plain ease-out, so it never wobbles.',
      '**Animate height, never jump.** Folders, the composer and code blocks grow to fit their content instead of snapping.' ] },
    { t: 'p', x: 'These are the tokens this prototype runs on:' },
    { t: 'code', lang: 'css', x: ':root {\n  --ease-out: cubic-bezier(.22, 1, .36, 1);\n  --spring:   cubic-bezier(.34, 1.56, .64, 1);\n  --t-fast:   180ms;  /* exits, hovers */\n  --t-base:   450ms;  /* enters, the active pill */\n  --t-slow:   700ms;  /* switching the look */\n}' },
    { t: 'p', x: 'Send a message below to watch a reply stream in.' } ],
  tree: [
    { t: 'p', x: 'The folders use the `grid-template-rows` trick, so they open to their real height with no JavaScript measuring:' },
    { t: 'code', lang: 'css', x: '.folder-body {\n  display: grid;\n  grid-template-rows: 1fr;\n  transition: grid-template-rows .45s var(--ease-out);\n}\n.folder.closed .folder-body { grid-template-rows: 0fr; }\n.folder-body > div { min-height: 0; overflow: hidden; }' },
    { t: 'p', x: 'The highlighted pill is one element that **slides** between rows on a spring, instead of each row lighting up on its own. That single moving piece is what makes the sidebar feel calm.' } ],
  beam: [
    { t: 'p', x: 'The glowing edge on the composer is a conic gradient masked down to a 1px ring. A registered `@property` angle lets the browser animate it smoothly:' },
    { t: 'code', lang: 'css', x: '@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }\n\n.composer::before {\n  padding: 1px;  /* ring width */\n  background: conic-gradient(from var(--a), transparent 0 250deg, var(--beam2), var(--beam1), transparent);\n  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);\n  animation: spin 4.5s linear infinite;\n}\n@keyframes spin { to { --a: 360deg; } }' },
    { t: 'p', x: 'It idles off, fades in when you focus the box, and **speeds up** while a reply is streaming. That gives you a status light without adding a spinner.' } ],
  generic: q => [
    { t: 'p', x: `Good question. This prototype has scripted replies, so here is a stand-in answer about **${q.length > 48 ? q.slice(0, 46).trim() + '...' : q}**.` },
    { t: 'p', x: 'Watch how the reply arrives. Each word fades in from a soft blur, the orb on the left spins faster while I think, and the ring around the box speeds up until I finish.' },
    { t: 'ul', x: [ 'Press the square button to stop a reply mid-stream.', 'Hover a finished reply to show copy and retry.', 'Ask about **motion**, the **sidebar tree** or the **border beam** for a longer answer with code.' ] } ],
};
const pick = q => /motion|anim|smooth|transition|feel/i.test(q) ? R.motion
  : /tree|sidebar|folder|height/i.test(q) ? R.tree
  : /beam|border|glow|ring|composer/i.test(q) ? R.beam : R.generic(q);

const chats = {
  motion:  { title: 'Motion system for chat UI', msgs: [{ u: 'I want this chat to feel smooth and pristine. What motion rules should the whole app follow?' }, { a: R.motion }] },
  tree:    { title: 'Sidebar tree with auto-height', msgs: [{ u: 'How do the folders in the sidebar open so smoothly?' }, { a: R.tree }] },
  beam:    { title: 'Border beam on the composer', msgs: [{ u: 'How is the glowing ring around the message box made?' }, { a: R.beam }] },
  fonts:   { title: 'Type pairing for dark UI', msgs: [{ u: 'What font works for a dark, clean AI app?' }, { a: [{ t: 'p', x: 'Use one neutral grotesk for everything and get contrast from **weight and size**, not from a second family. This prototype uses Geist with Geist Mono for code. On a dark background, set body text one step lighter than you would on white, around 400, and keep letter-spacing slightly negative on large headings.' }] }] },
  tokens:  { title: 'Color tokens per theme', msgs: [{ u: 'How should the color tokens be set up?' }, { a: [{ t: 'p', x: 'Every color is a CSS variable registered with `@property` as a `<color>`. Because the browser knows the type, it can **interpolate** colors instead of swapping them, so a future light theme or accent change cross-fades over 700ms instead of snapping.' }] }] },
  onboard: { title: 'Onboarding copy ideas', msgs: [{ u: 'Give me a one-line welcome for first-time users.' }, { a: [{ t: 'p', x: '"Ask anything. I will show my work." It is short, sets an expectation, and fits on one line at phone width.' }] }] },
  empty:   { title: 'Empty state layout', msgs: [{ u: 'What should the new chat screen show?' }, { a: [{ t: 'p', x: 'A greeting, one line of help, and four starting points. Click **New chat** in the sidebar to see this exact layout animate in.' }] }] },
  stream:  { title: 'Streaming text effect', msgs: [{ u: 'Why blur instead of a typewriter cursor?' }, { a: [{ t: 'p', x: 'A typewriter reveals one character at a time, which reads as slow. Blur-in reveals **whole words**, so the eye can read along as fast as the text arrives, and the edge of the reply looks soft instead of jagged.' }] }] },
};
const tree = [
  { label: 'Pinned', items: ['motion'] },
  { label: 'Projects', folders: [
    { id: 'f1', name: 'Lumen UI', items: ['tree', 'beam', 'stream'] },
    { id: 'f2', name: 'Research', items: ['fonts', 'tokens'], closed: true } ] },
  { label: 'Recent', id: 'recent', items: ['onboard', 'empty'] },
];

/* ---------- sidebar ---------- */
const nav = $('#nav'), ind = $('#ind');
let current = null;
const rowHTML = id => `<div class="row" data-row="${id}"><div><button class="item" data-id="${id}">${ico(id === 'motion' ? 'pin' : 'chat')}<span class="lbl">${chats[id].title}</span></button></div></div>`;
function buildNav() {
  let h = '';
  for (const g of tree) {
    h += `<div class="glabel">${g.label}</div><div ${g.id ? `id="g-${g.id}"` : ''}>`;
    if (g.items) h += g.items.map(rowHTML).join('');
    if (g.folders) for (const f of g.folders) h += `<div class="folder ${f.closed ? 'closed' : ''}" data-f="${f.id}">
      <div class="row"><div><button class="item fhead" aria-expanded="${!f.closed}">${ico('folder')}<span class="lbl">${f.name}</span><span class="count">${f.items.length}</span><svg class="ico chev" viewBox="0 0 24 24">${P.chev}</svg></button></div></div>
      <div class="folder-body"><div>${f.items.map(rowHTML).join('')}</div></div></div>`;
    h += '</div>';
  }
  nav.insertAdjacentHTML('beforeend', h);
}
function placeIndicator() {
  const a = nav.querySelector('.item.active');
  const hidden = !a || a.closest('.folder.closed') || a.closest('.row.hide') || a.closest('.row.entering');
  if (hidden) { ind.style.opacity = 0; return; }
  const n = nav.getBoundingClientRect(), r = a.getBoundingClientRect();
  ind.style.opacity = 1;
  ind.style.width = r.width + 'px';
  ind.style.height = r.height + 'px';
  ind.style.transform = `translate(${r.left - n.left}px, ${r.top - n.top + nav.scrollTop}px)`;
}
function trackIndicator(ms = 520) { const end = performance.now() + ms; (function f() { placeIndicator(); if (performance.now() < end) requestAnimationFrame(f); })(); }

nav.addEventListener('click', e => {
  const head = e.target.closest('.fhead');
  if (head) { const f = head.closest('.folder'); f.classList.toggle('closed'); head.setAttribute('aria-expanded', !f.classList.contains('closed')); trackIndicator(); return; }
  const it = e.target.closest('.item[data-id]');
  if (it) { openChat(it.dataset.id); if (phone()) html.classList.remove('sb-open'); }
});
$('#sb').addEventListener('pointermove', e => { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty('--mx', e.clientX - r.left + 'px'); e.currentTarget.style.setProperty('--my', e.clientY - r.top + 'px'); });

$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('.row[data-row]', nav).forEach(r => r.classList.toggle('hide', !!q && !chats[r.dataset.row].title.toLowerCase().includes(q)));
  if (q) $$('.folder', nav).forEach(f => { if ($$('.row[data-row]:not(.hide)', f).length) f.classList.remove('closed'); });
  trackIndicator();
});

function toggleSidebar() {
  if (phone()) html.classList.toggle('sb-open');
  else { html.classList.toggle('sb-off'); setTimeout(placeIndicator, 600); }
}
$('#sbOpen').onclick = toggleSidebar; $('#sbClose').onclick = toggleSidebar; $('#scrim').onclick = () => html.classList.remove('sb-open');

/* ---------- title ---------- */
function setTitle(t) {
  const old = $('#title');
  if (old.textContent === t) return;
  if (!old.textContent) { old.textContent = t; return; }
  const nw = old.cloneNode(); nw.removeAttribute('id'); nw.textContent = t; nw.classList.add('in');
  old.parentNode.append(nw); old.classList.add('out'); old.removeAttribute('id'); nw.id = 'title';
  requestAnimationFrame(() => requestAnimationFrame(() => nw.classList.remove('in')));
  setTimeout(() => old.remove(), 450);
}

/* ---------- rendering ---------- */
const col = $('#col'), thread = $('#thread');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const segs = s => s.split(/(`[^`]+`|\*\*[^*]+\*\*)/).filter(Boolean).map(p =>
  p.startsWith('`') ? { tag: 'code', s: p.slice(1, -1) } : p.startsWith('**') ? { tag: 'strong', s: p.slice(2, -2) } : { tag: null, s: p });
const inline = s => segs(s).map(g => g.tag ? `<${g.tag}>${esc(g.s)}</${g.tag}>` : esc(g.s)).join('');
const hl = line => esc(line)
  .replace(/(\/\*.*?\*\/)/g, '<span class="c">$1</span>')
  .replace(/(@property|@keyframes|--[\w-]+)/g, '<span class="k">$1</span>')
  .replace(/(?<![\w-])(\.?\d+(?:\.\d+)?(?:ms|s|px|fr|deg)?)(?![\w-])/g, '<span class="n">$1</span>');
const codeBox = lang => {
  const d = document.createElement('div'); d.className = 'code';
  d.innerHTML = `<header><span>${lang}</span><button class="mini" data-copy>${ico('copy')}<span>Copy</span></button></header><pre></pre>`;
  return d;
};
function blockStatic(b) {
  if (b.t === 'p') return `<p>${inline(b.x)}</p>`;
  if (b.t === 'ul') return `<ul>${b.x.map(i => `<li>${inline(i)}</li>`).join('')}</ul>`;
  const d = codeBox(b.lang); d.querySelector('pre').innerHTML = b.x.split('\n').map(l => `<span class="ln" style="animation:none">${hl(l) || ' '}</span>`).join('');
  d.querySelector('pre').dataset.raw = b.x; return d.outerHTML;
}
const actionsHTML = () => `<div class="actions"><button class="mini" data-copymsg>${ico('copy')}<span>Copy</span></button><button class="mini" data-retry>${ico('redo')}<span>Retry</span></button><button class="mini" aria-label="Good reply">${ico('up')}</button></div>`;

function userEl(text, fresh) {
  const m = document.createElement('div'); m.className = 'msg user' + (fresh ? ' fresh' : '');
  m.innerHTML = `<div class="bubble">${esc(text)}</div>`; return m;
}
function aiEl() {
  const m = document.createElement('div'); m.className = 'msg ai';
  m.innerHTML = `<span class="orb" aria-hidden="true"></span><div class="body"></div>`; return m;
}

function renderChat(id) {
  col.innerHTML = '';
  const c = chats[id];
  if (!c.msgs.length) return renderHero();
  c.msgs.forEach((m, i) => {
    let el;
    if (m.u) el = userEl(m.u);
    else { el = aiEl(); el.querySelector('.body').innerHTML = m.a.map(blockStatic).join('') + actionsHTML(); el.classList.add('done'); el.blocks = m.a; }
    el.classList.add('enter'); el.style.setProperty('--i', i); col.append(el);
  });
  thread.scrollTop = 0;
}

function greeting() { const h = new Date().getHours(); return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function renderHero() {
  const words = greeting().split(' ');
  const cards = [
    ['bolt', 'Design a motion system', 'Easing, timing and spring rules for a chat app'],
    ['layers', 'Explain the sidebar tree', 'How folders animate to their real height'],
    ['wand', 'Build a border beam', 'A glowing ring that spins around an input'],
    ['type', 'Pick a font pairing', 'Type that stays crisp on a dark background'],
  ];
  col.innerHTML = `<section class="hero"><h1>${words.map((w, i) => `<span class="w" style="--i:${i}">${w}</span> `).join('')}<span class="w" style="--i:${words.length}"><em>what's next?</em></span></h1>
    <p>Pick a starting point or type your own question.</p>
    <div class="cards">${cards.map((c, i) => `<button class="card" style="--i:${i}" data-ask="${c[1]}. ${c[2]}.">${ico(c[0])}<div><b>${c[1]}</b><small>${c[2]}</small></div></button>`).join('')}</div></section>`;
}
col.addEventListener('pointermove', e => { const c = e.target.closest('.card'); if (!c) return; const r = c.getBoundingClientRect(); c.style.setProperty('--mx', e.clientX - r.left + 'px'); c.style.setProperty('--my', e.clientY - r.top + 'px'); });

async function openChat(id) {
  if (busy) stop = true;
  if (current === id) return;
  current = id;
  $$('.item.active', nav).forEach(x => x.classList.remove('active'));
  const it = nav.querySelector(`.item[data-id="${id}"]`);
  if (it) it.classList.add('active');
  placeIndicator();
  setTitle(chats[id].title);
  col.classList.add('leaving');
  await sleep(180);
  renderChat(id);
  col.classList.remove('leaving');
}

let n = 0;
function newChat() {
  const id = 'new' + (++n);
  chats[id] = { title: 'New chat', msgs: [], fresh: true };
  openChat(id);
  setTimeout(() => ta.focus(), 250);
}
$('#newChat').onclick = () => { newChat(); if (phone()) html.classList.remove('sb-open'); };

/* ---------- streaming ---------- */
let busy = false, stop = false;
const nearBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 140;
const follow = () => { thread.scrollTop = thread.scrollHeight; };

async function streamWords(parent, text) {
  for (const g of segs(text)) {
    const host = g.tag ? parent.appendChild(document.createElement(g.tag)) : parent;
    for (const w of g.s.split(/(\s+)/)) {
      if (stop) return;
      if (!w) continue;
      if (/^\s+$/.test(w)) { host.append(w); continue; }
      const s = document.createElement('span'); s.className = 'tok'; s.textContent = w; host.append(s);
      const stick = nearBottom(); if (stick) follow();
      await sleep(22 + Math.random() * 38);
    }
  }
}
async function streamBlocks(body, blocks) {
  for (const b of blocks) {
    if (stop) return;
    if (b.t === 'p') await streamWords(body.appendChild(document.createElement('p')), b.x);
    else if (b.t === 'ul') { const ul = body.appendChild(document.createElement('ul')); for (const i of b.x) { if (stop) return; await streamWords(ul.appendChild(document.createElement('li')), i); } }
    else {
      const d = codeBox(b.lang); body.append(d); const pre = d.querySelector('pre'); pre.dataset.raw = b.x;
      for (const l of b.x.split('\n')) { if (stop) return; pre.insertAdjacentHTML('beforeend', `<span class="ln">${hl(l) || ' '}</span>`); if (nearBottom()) follow(); await sleep(70); }
    }
    await sleep(90);
  }
}

const ta = $('#ta'), form = $('#composer'), sendBtn = $('#send');
function fit() {
  const prev = ta.offsetHeight;
  ta.style.transition = 'none'; ta.style.height = 'auto';
  const next = Math.min(ta.scrollHeight, 220);
  ta.style.height = prev + 'px'; void ta.offsetHeight;
  ta.style.transition = ''; ta.style.height = next + 'px';
  ta.style.overflowY = ta.scrollHeight > 220 ? 'auto' : 'hidden';
  if (!busy) sendBtn.disabled = !ta.value.trim();
}
ta.addEventListener('input', fit);
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
form.addEventListener('submit', e => { e.preventDefault(); if (busy) { stop = true; return; } send(ta.value); });

async function send(text, opts = {}) {
  text = text.trim(); if (!text || busy) return;
  const id = current, c = chats[id];
  if (c.fresh) {
    c.fresh = false; c.title = text.length > 40 ? text.slice(0, 38).trim() + '...' : text;
    $('.hero', col)?.animate([{ opacity: 1 }, { opacity: 0, filter: 'blur(6px)', transform: 'translateY(-8px)' }], { duration: 220, fill: 'forwards' });
    await sleep(200); col.innerHTML = '';
    addRecent(id); setTitle(c.title);
  }
  if (!opts.retry) { c.msgs.push({ u: text }); col.append(userEl(text, true)); }
  ta.value = ''; fit(); follow();
  busy = true; stop = false; form.classList.add('busy'); sendBtn.disabled = false; sendBtn.setAttribute('aria-label', 'Stop');
  const m = aiEl(); m.classList.add('thinking', 'enter'); const body = m.querySelector('.body');
  body.innerHTML = '<span class="think">Thinking</span>'; col.append(m); follow();
  await sleep(900 + Math.random() * 700);
  body.innerHTML = ''; m.classList.remove('thinking');
  const blocks = pick(text);
  if (!stop) await streamBlocks(body, blocks);
  if (stop) body.insertAdjacentHTML('beforeend', '<p style="color:var(--muted);font-size:13px">Stopped.</p>');
  else if (current === id) c.msgs.push({ a: blocks });
  m.blocks = blocks; m.dataset.q = text;
  body.insertAdjacentHTML('beforeend', actionsHTML()); m.classList.add('done');
  busy = false; stop = false; form.classList.remove('busy'); sendBtn.setAttribute('aria-label', 'Send'); fit();
}

async function addRecent(id) {
  const host = $('#g-recent');
  host.insertAdjacentHTML('afterbegin', rowHTML(id));
  const row = host.firstElementChild, it = row.querySelector('.item'), lbl = it.querySelector('.lbl');
  const full = chats[id].title; lbl.textContent = '';
  row.classList.add('entering'); $$('.item.active', nav).forEach(x => x.classList.remove('active')); it.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => { row.classList.remove('entering'); trackIndicator(600); }));
  await sleep(200);
  for (let i = 1; i <= full.length; i++) { lbl.textContent = full.slice(0, i); await sleep(16); }
}

/* message actions */
col.addEventListener('click', async e => {
  const ask = e.target.closest('[data-ask]'); if (ask) { ta.value = ask.dataset.ask; fit(); send(ta.value); return; }
  const cp = e.target.closest('[data-copy]'), cm = e.target.closest('[data-copymsg]'), rt = e.target.closest('[data-retry]');
  if (cp || cm) {
    const btn = cp || cm;
    const txt = cp ? btn.closest('.code').querySelector('pre').dataset.raw : btn.closest('.body').innerText.replace(/Copy\s*Retry\s*$/, '').trim();
    try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch { toast('Copy is blocked here. Select the text instead.'); }
    btn.innerHTML = ico('check') + '<span>Copied</span>'; setTimeout(() => { btn.innerHTML = ico('copy') + '<span>Copy</span>'; }, 1400);
  }
  if (rt && !busy) {
    const m = rt.closest('.msg'); const q = m.dataset.q || chats[current].msgs.filter(x => x.u).pop()?.u || '';
    m.animate([{ opacity: 1 }, { opacity: 0, filter: 'blur(6px)' }], { duration: 200, fill: 'forwards' });
    await sleep(200); m.remove(); const c = chats[current]; if (c.msgs.at(-1)?.a) c.msgs.pop();
    send(q, { retry: true });
  }
});
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1600); }

/* composer chips */
$$('[data-toggle]').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));

/* model picker */
const model = $('#model');
$('#modelBtn').onclick = e => { e.stopPropagation(); const o = model.classList.toggle('open'); $('#modelBtn').setAttribute('aria-expanded', o); };
$$('.opt').forEach(o => o.onclick = () => { $$('.opt').forEach(x => x.classList.remove('sel')); o.classList.add('sel'); $('#modelName').textContent = o.dataset.m; model.classList.remove('open'); });
document.addEventListener('click', e => { if (!model.contains(e.target)) model.classList.remove('open'); });

/* keyboard */
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) { if (e.key === 'Escape') { model.classList.remove('open'); html.classList.remove('sb-open'); } return; }
  const k = e.key.toLowerCase();
  if (k === 'b') { e.preventDefault(); toggleSidebar(); }
  if (k === 'k') { e.preventDefault(); if (html.classList.contains('sb-off')) toggleSidebar(); if (phone()) html.classList.add('sb-open'); setTimeout(() => $('#q').focus(), 60); }
});

/* boot */
hydrateIcons();
buildNav();
openChat('motion');
addEventListener('resize', placeIndicator);
nav.addEventListener('scroll', placeIndicator);
document.fonts?.ready.then(placeIndicator);
</script>
